name: Auto-Deploy Staging

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: push to main OR manual dispatch.
# SILENT_ACTORS gate: if github.actor is in the SILENT_ACTORS repo variable,
# the entire workflow skips (no build, no deploy, no notifications).
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  # ── SILENT_ACTORS GATE ────────────────────────────────────────────────────
  # Reads the comma-separated SILENT_ACTORS repo variable and skips the entire
  # workflow if github.actor is on the list.
  gate:
    name: Silent-actor gate
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
      actor: ${{ github.actor }}
    steps:
      - id: check
        run: |
          set -eu
          ACTOR="${{ github.actor }}"
          SILENT="${{ vars.SILENT_ACTORS }}"
          if [ -z "$SILENT" ]; then
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "No SILENT_ACTORS variable set — running normally."
            exit 0
          fi
          if echo ",$SILENT," | grep -iq ",$ACTOR,"; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping entire workflow — @$ACTOR is in SILENT_ACTORS."
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "@$ACTOR not in SILENT_ACTORS — running normally."
          fi

  # ── BUILD & DEPLOY ────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build Flutter web → push to gh-pages
    needs: gate
    if: needs.gate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --base-href "/"

      - name: Preserve CNAME + .nojekyll
        run: |
          cd build/web
          echo "staging.nduproject.com" > CNAME
          touch .nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: staging build ${{ github.sha }}'
