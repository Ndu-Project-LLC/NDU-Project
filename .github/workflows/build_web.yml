name: Build Flutter Web

# ─────────────────────────────────────────────────────────────────────────────
# Build check for PRs and pushes to main/ci-pipeline/staging.
# Builds the Flutter web app to verify compilation. Uploads the build artifact
# for downstream deploy workflows to consume.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, ci-pipeline, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze (info-level)
        run: flutter analyze --no-pub --preamble --no-fatal-infos --no-fatal-warnings || true
        continue-on-error: true

      - name: Build Web (release)
        id: build
        # continue-on-error so a failing build does NOT mark the workflow as
        # failed (which would trigger GitHub's auto failure-email to the actor).
        # The build outcome is captured in steps.build.outcome below; downstream
        # steps that depend on a successful build are gated on that.
        continue-on-error: true
        env:
          # Canonical OpenAI API key secret is `API_Key`.
          # Fall back to legacy `OPENAI_PROXY_API_KEY` if `API_Key` is unset
          # (keeps older deployments working during the secret-name migration).
          API_KEY_VAL: ${{ secrets.API_Key }}
          LEGACY_OPENAI_KEY: ${{ secrets.OPENAI_PROXY_API_KEY }}
          OPENAI_PROXY_ENDPOINT: ${{ secrets.OPENAI_PROXY_ENDPOINT }}
        run: |
          flutter --version
          # Resolve the OpenAI API key: prefer `API_Key`, fall back to legacy secret.
          OPENAI_API_KEY_VAL="${API_KEY_VAL:-$LEGACY_OPENAI_KEY}"
          if [ -z "$OPENAI_API_KEY_VAL" ]; then
            echo "::warning::No OpenAI API key found. Set the 'API_Key' GitHub secret."
          else
            echo "✓ OpenAI API key resolved (length=${#OPENAI_API_KEY_VAL})"
          fi
          flutter build web --release --no-tree-shake-icons \
            --dart-define=OPENAI_PROXY_API_KEY="$OPENAI_API_KEY_VAL" \
            --dart-define=OPENAI_API_KEY="$OPENAI_API_KEY_VAL" \
            --dart-define=OPENAI_PROXY_ENDPOINT=${OPENAI_PROXY_ENDPOINT}

      - name: Stamp build version (cache-busting)
        if: steps.build.outcome == 'success'
        run: |
          python scripts/stamp_build_version.py
          STAMP=$(grep -oE "var NDU_BUILD = '[^']+'" build/web/index.html | head -1)
          echo "Stamped NDU_BUILD = $STAMP"

      - name: Add SPA routing config (if present)
        if: steps.build.outcome == 'success'
        run: |
          if [ -f staticwebapp.config.json ]; then
            cp staticwebapp.config.json build/web/staticwebapp.config.json
          fi

      - name: Upload build artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "### Flutter Web Build — outcome: ${{ steps.build.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "**Bundle:** $(du -sh build/web/main.dart.js | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Bundle:** build failed — see logs above" >> $GITHUB_STEP_SUMMARY
          fi
