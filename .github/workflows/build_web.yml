name: Build Flutter Web

# ─────────────────────────────────────────────────────────────────────────────
# Build check for PRs and pushes to main/ci-pipeline.
# Builds the Flutter web app to verify compilation. Uploads the build artifact
# for downstream deploy workflows to consume.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, ci-pipeline, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze (info-level)
        run: flutter analyze --no-pub --preamble --no-fatal-infos --no-fatal-warnings || true
        continue-on-error: true

      - name: Build Web (release)
        env:
          OPENAI_PROXY_API_KEY: ${{ secrets.OPENAI_PROXY_API_KEY }}
          OPENAI_PROXY_ENDPOINT: ${{ secrets.OPENAI_PROXY_ENDPOINT }}
        run: |
          flutter --version
          flutter build web --release --no-tree-shake-icons \
            --dart-define=OPENAI_PROXY_API_KEY=${OPENAI_PROXY_API_KEY} \
            --dart-define=OPENAI_PROXY_ENDPOINT=${OPENAI_PROXY_ENDPOINT}

      - name: Add SPA routing config (if present)
        run: |
          if [ -f staticwebapp.config.json ]; then
            cp staticwebapp.config.json build/web/staticwebapp.config.json
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
          retention-days: 7

      - name: Build summary
        run: |
          echo "### Flutter Web Build ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Bundle:** $(du -sh build/web/main.dart.js | cut -f1)" >> $GITHUB_STEP_SUMMARY
