name: Deploy Admin (admin.nduproject.com)

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: push to main OR manual dispatch.
# Builds the Flutter web app and deploys to the `gh-pages` branch of THIS repo,
# which serves https://admin.nduproject.com via GitHub Pages.
#
# SILENT_ACTORS gate: if github.actor is in the SILENT_ACTORS repo variable,
# the entire workflow skips (no build, no deploy, no notifications).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-deploy
  cancel-in-progress: false

jobs:
  # ── SILENT_ACTORS GATE ────────────────────────────────────────────────────
  gate:
    name: Silent-actor gate
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
      actor: ${{ github.actor }}
      sha: ${{ github.sha }}
    steps:
      - id: check
        run: |
          set -eu
          ACTOR="${{ github.actor }}"
          SHA="${{ github.sha }}"
          SILENT="${{ vars.SILENT_ACTORS }}"
          if [ -z "$SILENT" ]; then
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "No SILENT_ACTORS variable set — running normally."
            exit 0
          fi
          if echo ",$SILENT," | grep -iq ",$ACTOR,"; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping entire workflow — @$ACTOR is in SILENT_ACTORS."
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "@$ACTOR not in SILENT_ACTORS — running normally."
          fi

  # ── BUILD & DEPLOY ────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build Flutter web → push to gh-pages (admin.nduproject.com)
    needs: gate
    if: needs.gate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Build web (release)
        env:
          OPENAI_PROXY_API_KEY: ${{ secrets.OPENAI_PROXY_API_KEY }}
          OPENAI_PROXY_ENDPOINT: ${{ secrets.OPENAI_PROXY_ENDPOINT }}
        run: |
          flutter build web --release --base-href "/" --no-tree-shake-icons \
            --dart-define=OPENAI_PROXY_API_KEY=${OPENAI_PROXY_API_KEY} \
            --dart-define=OPENAI_PROXY_ENDPOINT=${OPENAI_PROXY_ENDPOINT}

      - name: Preserve admin CNAME + .nojekyll
        run: |
          cd build/web
          echo "admin.nduproject.com" > CNAME
          touch .nojekyll
          echo "✓ CNAME = $(cat CNAME)"
          echo "✓ .nojekyll created"

      - name: Generate deploy metadata
        id: meta
        run: |
          BUILD_SHA="${{ needs.gate.outputs.sha }}"
          BUILD_SHORT="${BUILD_SHA:0:7}"
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          BUNDLE_SIZE=$(du -sh build/web/main.dart.js | cut -f1)
          {
            echo "sha=$BUILD_SHA"
            echo "short=$BUILD_SHORT"
            echo "date=$BUILD_DATE"
            echo "bundle=$BUNDLE_SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "Build SHA: $BUILD_SHORT"
          echo "Build date: $BUILD_DATE"
          echo "Bundle size: $BUNDLE_SIZE"

      - name: Deploy to gh-pages (admin.nduproject.com)
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Use ACCESS_TOKEN (PAT with repo scope) instead of the default GITHUB_TOKEN,
          # because the repo's default workflow permissions may be read-only and
          # github-actions[bot] would otherwise be denied push access to gh-pages.
          personal_token: ${{ secrets.ACCESS_TOKEN }}
          external_repository: Ndu-Project-LLC/admin.nduproject.com
          publish_dir: build/web
          publish_branch: gh-pages
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: |
            deploy: admin.nduproject.com — fresh rebuild from ${{ steps.meta.outputs.short }}

      - name: Deployment summary
        run: |
          echo "============================================"
          echo "  ✅ Admin deploy complete"
          echo "============================================"
          echo "  Source SHA:  ${{ steps.meta.outputs.short }}"
          echo "  Built at:    ${{ steps.meta.outputs.date }}"
          echo "  Bundle size: ${{ steps.meta.outputs.bundle }}"
          echo "  Target:      gh-pages (admin.nduproject.com)"
          echo ""
          echo "  Live URL:    https://admin.nduproject.com"
          echo "  (Pages rebuild takes ~60-90s after push)"
          echo "============================================"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Admin deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.meta.outputs.short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** @${{ needs.gate.outputs.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bundle:** ${{ steps.meta.outputs.bundle }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://admin.nduproject.com/" >> $GITHUB_STEP_SUMMARY
