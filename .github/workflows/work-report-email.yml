name: Work Report Email

# Sends a plain-language summary of recent commits to a fixed list of three
# recipients. Recipients are hardcoded in ALLOWED_RECIPIENTS below and the
# send step refuses to run against any address not on that list, so no other
# email can ever be notified by this workflow.
on:
  schedule:
    # Daily at 07:00 UTC. GitHub queues scheduled runs on shared runners, so
    # this can drift by a few minutes during busy periods.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours of history to cover"
        required: false
        default: "24"

permissions:
  contents: read

# One report at a time; never stack runs.
concurrency:
  group: work-report-email
  cancel-in-progress: false

jobs:
  send_work_report:
    name: Build and send work report
    runs-on: ubuntu-latest
    env:
      REPORT_WINDOW_HOURS: ${{ github.event.inputs.hours || '24' }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # nduproject.tech is the domain verified in the Resend account; an
      # unverified sender is rejected with a 403 on every send.
      MAIL_FROM: ${{ vars.MAIL_FROM || 'NduProject <reports@nduproject.tech>' }}
      ALLOWED_RECIPIENTS: >-
        clivatem@gmail.com
        chungu424@gmail.com
        chimmie@nduproject.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Need full history so `git log --since` sees commits on this run.
          fetch-depth: 0

      - name: Guard on missing mail configuration
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Validate recipient list
        run: |
          # Fail loudly if anyone ever edits ALLOWED_RECIPIENTS into something
          # that isn't a plain list of three addresses. Count addresses, not
          # lines: the YAML folds all three onto a single line.
          count=$(printf '%s\n' "$ALLOWED_RECIPIENTS" | tr ' ' '\n' | grep -c '@' || true)
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected exactly 3 recipients, found $count."
            exit 1
          fi
          echo "Recipients confirmed: $(echo $ALLOWED_RECIPIENTS)"

      - name: Build report
        run: |
          python3 .github/scripts/build_work_report.py > report.html
          # The report is the deliverable; keep it readable in the log too.
          echo "Report generated ($(wc -c < report.html) bytes)."
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("report.html").read_text()
          bullets = re.findall(r"<li[^>]*>(.*?)</li>", html, re.S)
          print(f"Work report contains {len(bullets)} bullet points:")
          for b in bullets[:15]:
              print(f"  - {re.sub('<[^>]+>', '', b)[:140]}")
          PY

      - name: Send email to the three recipients only
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess, sys

          allowed = [e.strip() for e in os.environ["ALLOWED_RECIPIENTS"].split() if "@" in e]
          html = pathlib.Path("report.html").read_text()
          subject = "Work Report - " + datetime.datetime.now(datetime.timezone.utc).strftime("%B %d, %Y")

          # Per-recipient send. No CC, no BCC, no group address: the only
          # addresses that ever receive this are the three on the allowlist.
          failures = []
          for addr in allowed:
              payload = {
                  "from": os.environ["MAIL_FROM"],
                  "to": [addr],
                  "subject": subject,
                  "html": html,
              }
              res = subprocess.run(
                  [
                      "curl", "-sS", "-w", "\\n%{http_code}", "-X", "POST",
                      "https://api.resend.com/emails",
                      "-H", f"Authorization: Bearer {os.environ['RESEND_API_KEY']}",
                      "-H", "Content-Type: application/json",
                      "--data-binary", "@-",
                  ],
                  input=json.dumps(payload).encode(),
                  capture_output=True,
              )
              # -w "\n%{http_code}" appends the status as the final line; take the last
              # non-empty line so a trailing newline can't hide it.
              lines = [l for l in res.stdout.decode().splitlines() if l.strip()]
              code = lines[-1].strip() if lines else ""
              body = "\n".join(lines[:-1])
              if res.returncode != 0 or not code.startswith("2"):
                  failures.append(addr)
                  print(f"FAILED  -> {addr}: HTTP {code or 'no response'} {body[:200]}")
              else:
                  print(f"sent    -> {addr}")

          if failures:
              print(f"::error::Failed to send to: {', '.join(failures)}")
              sys.exit(1)
          PY