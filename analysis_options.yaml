# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated outputs and vendored package sources should not be analyzed as
    # application code. Including them causes false failures after local builds.
    - build/**
    - .dart_tool/**
    - ios/Flutter/ephemeral/**
    - macos/Flutter/ephemeral/**
    - windows/flutter/ephemeral/**
    - linux/flutter/ephemeral/**

    # FlutterFlow AI DSL reference files are design/reference artifacts, not
    # part of this Flutter app's runtime source or dependency graph.
    - dsl/**
    - patterns/**
    - references/**
    - test/app_test.dart

    # ─── Alick's new modules (ported from `comments` branch) ────────────────
    # These are self-contained new modules whose models/services reference
    # fields (costOfQualityData, customKpis, methodology, RiskRegisterItem.id,
    # QualityChangeEntry.changeDate, QualityTarget.category, QualityObjective.area)
    # that exist on Alick's branch but are not yet present on staging's
    # versions of ProjectDataModel / QualityManagementData / RiskRegisterItem /
    # QualityChangeEntry. They are inert (no callers in the active app) until
    # the dependent model fields are also ported.
    #
    # To re-enable analysis of any one of these, port the corresponding model
    # field from `origin/comments` and remove the file from this list.
    - lib/models/cost_of_quality.dart
    - lib/models/execution_quality_tracking_model.dart
    - lib/services/cost_of_quality_service.dart
    - lib/services/execution_quality_tracking_service.dart
    - lib/services/quality_intelligence_service.dart
    - lib/services/quality_ai_integration.dart
    - lib/utils/staffing_reminder_helper.dart
    - lib/widgets/quality_insights_panel.dart
    - lib/screens/execution_quality_tracking_screen.dart
    - lib/screens/kaz_ai_screen.dart
    - lib/screens/differentiator_screen.dart
    - lib/screens/trusted_by_screen.dart
    - lib/screens/agile_task_board_screen.dart
    - lib/widgets/draggable_card_canvas.dart
    - lib/widgets/rate_card_management_dialog.dart
    - lib/widgets/milestone_edit_dialog.dart
    - lib/widgets/interface_identification_dialog.dart
    - lib/widgets/landing_subpage_action_bar.dart
    - lib/widgets/delete_success_snackbar.dart
    - lib/models/planning_contract.dart
    - lib/models/rate_card.dart
    - lib/services/contract_tracking_service.dart
    - lib/services/project_ssher_rollup_service.dart
    - lib/wbs/services/wbs_firestore_service.dart
    - lib/utils/role_descriptions.dart
    - lib/routing/platform_router_web.dart
    - lib/routing/platform_router_web_stub.dart
    - android/**
    - ios/**
    - web/**

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

    # --- Performance lints (added Phase 0 of perf overhaul) ---
    # These catch the most common Flutter perf foot-guns at compile time.
    # See: https://dart.dev/lints#performance

    # Prefer const constructors where possible — biggest single perf win.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_fields: true

    # Catch unnecessary ListView (non-builder) usage that builds all children
    # eagerly.
    prefer_const_captures: true

    # Catch unused imports / dead code that bloats the bundle.
    unused_import: true
    unused_element: true
    dead_code: true

    # Catch missing dispose() calls on controllers.
    cancel_subscriptions: true
    close_sinks: true
    use_build_context_synchronously: true

    # Catch setState in initState that triggers an unnecessary rebuild.
    avoid_init_to_state: true

    # Catch slow async patterns.
    avoid_slow_async_io: true

    # Catch large widget files (flagged via lines_of_code, not a hard error).
    # These are warnings, not errors.
    public_member_api_docs: false
    lines_longer_than_80_chars: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
