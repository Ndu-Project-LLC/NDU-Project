plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.mycompany.nduprojectprogram"
    compileSdk = flutter.compileSdkVersion
    // Pinned to the NDK actually installed on this machine. Flutter's default
    // (28.2.13676358) is present only as an aborted-download stub in the SDK,
    // which AGP rejects with CXX1101. Re-install it via sdkmanager and restore
    // `flutter.ndkVersion` when convenient.
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
    }

    defaultConfig {
        // The application ID is permanent once the app is uploaded to Google Play.
        applicationId = "com.mycompany.nduprojectprogram"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // flutter_appauth pulls in net.openid:appauth, whose manifest declares its
        // redirect receiver as <data android:scheme="${appAuthRedirectScheme}" />.
        // The merged manifest fails without a value here (the release build stops
        // at :app:processReleaseMainManifest). The scheme must match the redirect
        // URI the Dart side uses: IntegrationOAuthService.redirectUri.
        manifestPlaceholders["appAuthRedirectScheme"] = "nduproject"
    }

    buildTypes {
        release {
            // Signed with the upload key from android/key.properties, which points
            // at android/keys/ndu-upload.jks. Without that file the release signing
            // config is empty and the build fails in validateSigningRelease.
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
