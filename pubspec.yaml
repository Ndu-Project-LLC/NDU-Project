  go_router: ^17.0.0
  url_launcher: ^6.0.0
  google_sign_in: '>=6.2.1'
  firebase_auth: '>=5.3.3'
  cloud_firestore: '>=5.5.0'
  firebase_storage: '>=13.0.0'
  shimmer: ^3.0.0
  http: ^1.0.0
  flutter_svg: ^2.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  firebase_core: ^4.2.0
  provider: ^6.0.0
  shared_preferences: ^2.0.0
  intl: ^0.20.2
  flutter_appauth: ^12.0.2
  flutter_secure_storage: ^10.3.0
  flutter_markdown: ^0.7.2
  pdf: ^3.10.8
  printing: ">=5.14.3"
  webview_flutter: ^4.7.0
  webview_flutter_web: ^0.2.3+4
  webview_flutter_platform_interface: ^2.6.0
