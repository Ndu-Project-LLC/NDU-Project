<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NDU Project - Navigate. Deliver. Upgrade.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NDU Project">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=NDU_BUILD_STAMP">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=NDU_BUILD_STAMP">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=NDU_BUILD_STAMP">
  <link rel="manifest" href="manifest.json?v=NDU_BUILD_STAMP">
  <title>NDU Project</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .loading-container { text-align: center; color: #94a3b8; }
    .loading-brand { margin-bottom: 24px; color: #e2e8f0; font-size: 18px; font-weight: 600; letter-spacing: .08em; }
    .loading-brand .accent { color: #3b82f6; }
    .loading-spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 3px solid rgba(148, 163, 184, .2);
      border-top-color: #3b82f6; border-radius: 50%; animation: ndu-spin 1s linear infinite;
    }
    .loading-text { font-size: 14px; opacity: .7; letter-spacing: .02em; }
    .loading-container.is-hidden { opacity: 0; pointer-events: none; transition: opacity 180ms ease; }
    @keyframes ndu-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading-container" id="loading-indicator" role="status" aria-live="polite">
    <div class="loading-brand">NDU <span class="accent">Project</span></div>
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading NDU Project...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (!loader) return;
      loader.classList.add('is-hidden');
      window.setTimeout(function() { loader.remove(); }, 220);
    });
  </script>
  <!--
    Boot diagnostics. A start that fails or stalls has to say so on screen:
    otherwise a broken boot is visually identical to a site that has not
    loaded yet — same dark background, no console, nothing to act on. These
    three listeners only ever add a message; they never block Flutter.
  -->
  <script>
    (function() {
      var started = Date.now();
      var reported = false;

      function fail(title, detail) {
        if (reported) return;
        reported = true;
        try {
          var box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;'
            + 'background:#7f1d1d;color:#fecaca;padding:14px 18px;'
            + 'font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;'
            + 'white-space:pre-wrap;word-break:break-word;';
          var head = document.createElement('strong');
          head.textContent = title + '\n';
          var body = document.createElement('span');
          body.textContent = detail;
          box.appendChild(head);
          box.appendChild(body);
          document.body.appendChild(box);
        } catch (_) {}
      }

      // A script that never loads (blocked, offline, interrupted) leaves the
      // spinner running forever with no indication of why.
      window.addEventListener('error', function(e) {
        var target = e.target;
        if (target && target !== window && target.tagName === 'SCRIPT') {
          fail('NDU Project could not start',
            'A required script failed to load: ' + (target.src || 'unknown') +
            '\nCheck the connection (or a blocking extension) and reload.');
          return;
        }
        if (e.message) {
          fail('NDU Project could not start', e.message +
            (e.filename ? '\n' + e.filename.split('/').pop() + ':' + (e.lineno || 0) : ''));
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        var msg = r && (r.stack || r.message) ? String(r.stack || r.message) : String(r);
        fail('NDU Project could not start', msg.split('\n').slice(0, 4).join('\n'));
      });

      // Stalled start: keep the user informed instead of spinning silently.
      window.setInterval(function() {
        var el = document.getElementById('loading-indicator');
        if (!el || reported) return;
        var secs = Math.round((Date.now() - started) / 1000);
        if (secs < 15) return;
        var text = el.querySelector('.loading-text');
        if (text) {
          text.textContent = 'Still loading… ' + secs + 's.'
            + (secs >= 45 ? ' This is taking too long — reload the page.'
                          : ' A slow connection can take a while.');
        }
      }, 1000);
    })();
  </script>
  <!-- Runtime config must be available before Flutter starts. -->
  <script>
    (function() {
      // Restore real paths for deep links that arrived via the GitHub Pages
      // 404.html SPA fallback, which redirects /route to /?/route. Runs before
      // env-config.js / Flutter bootstrap so the app boots on the right route.
      // Mirrors the ~and~ encoding that 404.html applies to '&' characters.
      var l = window.location;
      if (l.search.indexOf('?/') !== 0) return;
      var restored = l.search.slice(2).replace(/~and~/g, '&');
      if (!restored) return;
      var queryIndex = restored.indexOf('&');
      var path = queryIndex === -1 ? restored : restored.slice(0, queryIndex);
      var query = queryIndex === -1 ? '' : '?' + restored.slice(queryIndex + 1);
      history.replaceState(null, '', l.pathname + path + query + l.hash);
    })();
  </script>
  <script src="env-config.js?v=NDU_BUILD_STAMP"></script>
  <script>
    (function() {
      // The build script replaces this stamp in all deployment artifacts.
      var build = 'NDU_BUILD_STAMP';
      if (!/^\d{10}$/.test(build)) return;
      // Keep browser/Flutter caches between visits. Check for a deployment
      // update in the background; a version endpoint outage never blocks boot.
      try {
        fetch('version.json', {cache: 'no-cache'})
          .then(function(response) { return response.ok ? response.json() : null; })
          .then(function(latest) {
            if (!latest || !latest.build || latest.build === build) return;
            var url = new URL(location.href);
            if (url.searchParams.get('_ndu') === latest.build) return;
            url.searchParams.set('_ndu', latest.build);
            location.replace(url.toString());
          })
          .catch(function() { /* Offline or unavailable: let cached app boot. */ });
      } catch (_) { /* Older browsers can still run the app. */ }
    })();
  </script>
  <script src="flutter_bootstrap.js?v=NDU_BUILD_STAMP" async></script>
</body>
</html>
